[package]
name = "unplugged"
version = "0.6.0"
description = "A free, open-source DAW for recording at home: multitrack, effects, one-click sharing"
license = "MIT"
repository = "https://github.com/zombodotcom/unplugged"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
clack-extensions = { version = "0.2", features = ["clack-host", "gui", "state", "audio-ports", "params", "latency", "log", "timer", "thread-check"] }
clack-host = "0.2"
cpal = "0.18"
ebur128 = "0.1.10"
eframe = "0.36"
egui = "0.36"
flacenc = "0.5.1"
hound = "3.5"
mp3lame-encoder = "0.2.5"
parking_lot = "0.12"
realfft = "3.5.0"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vst3-host = { version = "0.9", default-features = false, features = ["raw-window-handle"] }

[features]
# Low-latency ASIO driver support (Focusrite ships an ASIO driver). Needs the ASIO SDK
# and LLVM installed - see README.
asio = ["cpal/asio"]

[profile.dev]
# Audio DSP is too slow unoptimised; keep debug builds usable.
opt-level = 2

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
